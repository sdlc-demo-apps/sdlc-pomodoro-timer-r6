<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pomodoro Timer · Hi-Fi mockup</title><style>:root{--color-bg:#F7F4EF;--color-surface:#FFFFFF;--color-text:#1F2328;--color-muted:#57606A;--color-focus:#B3261E;--color-short:#1B6E4B;--color-long:#1F5FA8;--color-border:#D0C8BC;--color-ring:#6B3FA0;--color-msg-bg:#FFF4D6;--color-msg-border:#8A6100;--color-mock:#24292F;--color-mock-text:#F6F8FA;--font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-digits:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--fs-sm:0.875rem;--fs-md:1rem;--fs-lg:1.25rem;--fs-digits:clamp(4.5rem,22vw,9rem);--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--radius:12px;--radius-pill:999px;--touch:44px;--accent:var(--color-focus)}*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-text);font-size:var(--fs-md)}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.mockbar{background:var(--color-mock);color:var(--color-mock-text);padding:var(--sp-2);display:flex;flex-wrap:wrap;gap:var(--sp-1);align-items:center;font-size:var(--fs-sm)}.mockbar strong{margin-right:var(--sp-2)}.mockbar button{background:#3A4048;color:var(--color-mock-text);border:1px solid #57606A;border-radius:6px;padding:0 10px;font:inherit;cursor:pointer;min-height:var(--touch)}.mockbar button[aria-current="true"]{background:#F6F8FA;color:#24292F}.tabtitle{font-size:var(--fs-sm);color:var(--color-muted);text-align:center;padding:var(--sp-2);border-bottom:1px dashed var(--color-border)}.app{max-width:560px;margin:0 auto;padding:var(--sp-5) var(--sp-4)}h1{font-size:var(--fs-lg);margin:0 0 var(--sp-4);text-align:center}.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:var(--sp-5) var(--sp-4);border-top:6px solid var(--accent)}.modes{display:flex;gap:var(--sp-2);justify-content:center;flex-wrap:wrap}.mode-btn{min-height:var(--touch);min-width:var(--touch);padding:0 var(--sp-4);border-radius:var(--radius-pill);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);font:inherit;cursor:pointer}.mode-btn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:4px}.timer-display{font-family:var(--font-digits);font-size:var(--fs-digits);font-weight:700;text-align:center;margin:var(--sp-5) 0;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}.mode-label{text-align:center;color:var(--color-muted);margin-top:calc(-1*var(--sp-4))}.controls{display:flex;gap:var(--sp-3);justify-content:center;margin-top:var(--sp-5)}.btn{min-height:var(--touch);min-width:120px;padding:0 var(--sp-5);border-radius:var(--radius);font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--accent)}.btn-primary{background:var(--accent);color:#fff}.btn-secondary{background:var(--color-surface);color:var(--accent)}.today-count{text-align:center;margin-top:var(--sp-5);color:var(--color-text)}.end-message{margin-top:var(--sp-4);background:var(--color-msg-bg);border:1px solid var(--color-msg-border);border-radius:var(--radius);padding:var(--sp-3) var(--sp-4);display:flex;gap:var(--sp-3);align-items:center;justify-content:space-between}.end-message button{min-height:var(--touch);padding:0 var(--sp-4);border-radius:var(--radius);border:1px solid var(--color-msg-border);background:#fff;color:var(--color-text);font:inherit;cursor:pointer}.mute-toggle{display:block;margin:var(--sp-4) auto 0;min-height:var(--touch);padding:0 var(--sp-4);border-radius:var(--radius-pill);border:1px dashed var(--color-border);background:transparent;color:var(--color-muted);font:inherit;cursor:pointer}.note{font-size:var(--fs-sm);color:var(--color-muted);text-align:center;margin-top:var(--sp-4)}button:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}.notes{max-width:900px;margin:0 auto;padding:var(--sp-5) var(--sp-4);line-height:1.5}.notes table{border-collapse:collapse;width:100%;font-size:var(--fs-sm);margin-bottom:var(--sp-5)}.notes th,.notes td{border:1px solid var(--color-border);padding:6px;text-align:left;vertical-align:top}.sw{display:inline-block;width:20px;height:20px;border-radius:4px;border:1px solid #999;vertical-align:middle}code{font-family:var(--font-digits);font-size:0.85em}.wrap{overflow-x:auto}</style></head><body><nav class="mockbar" aria-label="Mockup screens"><strong>MOCKUP</strong><span id="mb"></span></nav><div id="root"></div><script>var states=[{id:`first`,label:`1 First load`},{id:`running`,label:`2 Focus running`},{id:`paused`,label:`3 Paused`},{id:`short`,label:`4 Focus done → short`},{id:`long`,label:`5 4th done → long`},{id:`breakover`,label:`6 Break over`},{id:`muted`,label:`7 Muted (Could)`},{id:`fallback`,label:`8 Bad storage → defaults`},{id:`reload`,label:`9 Reload mid-run`},{id:`notes`,label:`Design notes`}];var cur=`first`;var accents={focus:`var(--color-focus)`,short:`var(--color-short)`,long:`var(--color-long)`};var names={focus:`Focus`,short:`Short break`,long:`Long break`};function modes(m){return `<div class="modes" role="group" aria-label="Mode">`+[`focus`,`short`,`long`].map(function(k){return `<button class="mode-btn" aria-pressed="${k===m}">${names[k]}</button>`}).join(``)+`</div>`}function app(o){var running=o.status===`running`;var title=running?`${o.time} · ${names[o.mode]} · Pomodoro Timer`:`Pomodoro Timer`;var msg=o.msg?`<div class="end-message" aria-live="polite" role="status"><span>${o.msg}</span><button data-act="dismiss">Dismiss</button></div>`:`<div aria-live="polite" role="status" class="sr"></div>`;return `<div class="tabtitle">Browser tab title: <strong>${title}</strong></div><main class="app" style="--accent:${accents[o.mode]}"><h1>Pomodoro Timer</h1><section class="card">${modes(o.mode)}<div class="timer-display">${o.time}</div><p class="mode-label">${names[o.mode]}${o.status===`paused`?` · Paused`:``}</p><div class="controls"><button class="btn btn-primary">${running?`Pause`:`Start`}</button><button class="btn btn-secondary">Reset</button></div>${msg}<p class="today-count">Today: <strong>${o.count}</strong> focus session${o.count===1?``:`s`}</p>${o.mute!==undefined?`<button class="mute-toggle" aria-pressed="${o.mute}">${o.mute?`🔇 Sound off`:`🔊 Sound on`}</button>`:``}</section>${o.note?`<p class="note">${o.note}</p>`:``}</main>`}var data={first:{mode:`focus`,time:`25:00`,status:`stopped`,count:0,note:`Entry screen: no stored data yet (empty state).`},running:{mode:`focus`,time:`24:57`,status:`running`,count:2,note:`Running 3 s after Start. Start becomes Pause; digits are not announced.`},paused:{mode:`focus`,time:`12:34`,status:`paused`,count:2},short:{mode:`short`,time:`05:00`,status:`stopped`,count:3,msg:`Focus session complete. Time for a short break.`,note:`Sound played once; app waits for Start.`},long:{mode:`long`,time:`15:00`,status:`stopped`,count:4,msg:`Focus session complete. Time for a long break.`,note:`4th completed focus session in the cycle: Long break suggested.`},breakover:{mode:`focus`,time:`25:00`,status:`stopped`,count:4,msg:`Break over. Ready to focus?`,note:`Long break taken: cycle position restarts at 0 (stored, not shown).`},muted:{mode:`focus`,time:`25:00`,status:`stopped`,count:1,mute:true,note:`MuteToggle shown only if S9 is built.`},fallback:{mode:`focus`,time:`25:00`,status:`stopped`,count:0,note:`Recovery path (NFR-06): the key pomodoro-timer:v1 held malformed JSON (or was missing, or had an unknown version). storage.load() returned defaults: count 0, cycle 0, muted false. No error message is shown; the screen is identical to first load and the next save overwrites the bad record.`},reload:{mode:`focus`,time:`25:00`,status:`stopped`,count:2,note:`Page reloaded while Focus was running with 12:00 left. The running timer is not restored: it shows 25:00, stopped. Today's count (2) and the cycle position are unchanged (BR-07).`}};var palette=[[`--color-bg`,`#F7F4EF`,`Page background`],[`--color-surface`,`#FFFFFF`,`Card, secondary buttons`],[`--color-text`,`#1F2328`,`Body text: 15.8:1 on surface, 14.4:1 on msg-bg`],[`--color-muted`,`#57606A`,`Labels, notes: 6.4:1 on surface, 5.8:1 on bg`],[`--color-focus`,`#B3261E`,`Focus accent: 6.5:1 with white`],[`--color-short`,`#1B6E4B`,`Short break accent: 6.2:1 with white`],[`--color-long`,`#1F5FA8`,`Long break accent: 6.4:1 with white`],[`--color-border`,`#D0C8BC`,`Card and button borders (decorative)`],[`--color-ring`,`#6B3FA0`,`Focus ring 3 px: 7.4:1 on surface, 6.7:1 on bg`],[`--color-msg-bg`,`#FFF4D6`,`EndMessage background`],[`--color-msg-border`,`#8A6100`,`EndMessage border`]];function notes(){var rows=palette.map(function(p){return `<tr><td><span class="sw" style="background:${p[1]}"></span> <code>${p[0]}</code></td><td>${p[1]}</td><td>${p[2]}</td></tr>`}).join(``);var comps=[[`App`,`Layout; sets --accent per mode`],[`ModeSelector`,`.mode-btn pills; active = filled + bold + underline + aria-pressed`],[`TimerDisplay`,`.timer-display monospace digits; plain text, no aria-label, not aria-live`],[`Controls`,`.btn-primary Start/Pause, .btn-secondary Reset`],[`EndMessage`,`.end-message aria-live polite, Dismiss button; empty live region uses .sr (visually hidden)`],[`TodayCount`,`.today-count text: Today: N focus sessions`],[`MuteToggle`,`.mute-toggle, aria-pressed (S9 only)`]].map(function(c){return `<tr><td><code>${c[0]}</code></td><td>${c[1]}</td></tr>`}).join(``);return `<main class="notes"><h1 style="text-align:left">Design notes</h1><h2>Palette</h2><p>Contrast ratios are calculated with the WCAG 2.1 relative luminance formula. All text pairs meet AA (4.5:1); the focus ring meets 3:1 for non-text UI.</p><div class="wrap"><table><tr><th>Token</th><th>Hex</th><th>Use and contrast</th></tr>${rows}</table></div><h2>Typography</h2><div class="wrap"><table><tr><th>Token</th><th>Value</th><th>Use</th></tr><tr><td><code>--font-sans</code></td><td>system-ui stack</td><td>All UI text</td></tr><tr><td><code>--font-digits</code></td><td>ui-monospace stack, bold, tabular</td><td>TimerDisplay</td></tr><tr><td><code>--fs-digits</code></td><td>clamp(4.5rem, 22vw, 9rem)</td><td>Digits; fits 320 px</td></tr><tr><td><code>--fs-sm / md / lg</code></td><td>0.875 / 1 / 1.25 rem</td><td>Notes / body / heading</td></tr></table></div><h2>Spacing, radius, targets</h2><p><code>--sp-1..6</code> = 4, 8, 12, 16, 24, 32 px. <code>--radius</code> 12 px, <code>--radius-pill</code> 999 px. <code>--touch</code> 44 px minimum for every button, including the mockup bar. Focus ring: 3 px <code>--color-ring</code> outline, 3 px offset, via :focus-visible.</p><h2>Components (names match the SDD)</h2><div class="wrap"><table><tr><th>Component</th><th>Style</th></tr>${comps}</table></div><h2>Behaviour notes</h2><ul><li>Mode accent: card top border, digits and primary button use <code>--accent</code>, set from the mode colour token.</li><li>Tab title while running: <code>MM:SS · Mode · Pomodoro Timer</code>; otherwise <code>Pomodoro Timer</code>.</li><li>The cycle position is stored but not displayed (no cycle indicator in the BRD or SDD).</li><li>Bad or missing storage falls back silently to count 0 and cycle 0 (screen 8). A reload mid-run restarts the mode at full duration, stopped (screen 9).</li><li>Layout: single column, max width 560 px; mode buttons wrap on narrow screens; no horizontal scroll from 320 px.</li><li>The mockup bar and tab-title strip are design aids, not part of the app.</li></ul></main>`}function render(){document.getElementById(`mb`).innerHTML=states.map(function(s){return `<button data-s="${s.id}" aria-current="${s.id===cur}">${s.label}</button>`}).join(``);document.getElementById(`root`).innerHTML=cur===`notes`?notes():app(data[cur])}document.addEventListener(`click`,function(e){var t=e.target.closest(`button`);if(!t)return;var s=t.getAttribute(`data-s`);if(s){cur=s;render();return}if(t.getAttribute(`data-act`)===`dismiss`){var m=document.querySelector(`.end-message`);if(m)m.remove()}});render();</script></body></html>
